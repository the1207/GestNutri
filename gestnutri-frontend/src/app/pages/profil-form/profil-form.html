<div class="page-heading"><div><p class="eyebrow">Configuration</p><h2>{{ id === null ? 'Nouveau profil nutritionnel' : 'Modifier le profil nutritionnel' }}</h2></div></div>

<p-card>
  <form (ngSubmit)="onSubmit()">
    <div class="field"><label for="nomCategorie">Nom de la catégorie</label><input pInputText id="nomCategorie" [(ngModel)]="nomCategorie" name="nomCategorie" required /></div>
    <div class="field"><label for="stade">Stade</label><input pInputText id="stade" [(ngModel)]="stade" name="stade" required /></div>
    <div class="field-inline"><p-checkbox [binary]="true" [(ngModel)]="estPersonnalise" name="estPersonnalise" inputId="perso" /><label for="perso">Personnalisé</label></div>

  <h3>Besoins nutritionnels</h3>
  @for (besoin of besoins; track $index) {
    <div>
      <p-select [(ngModel)]="besoin.nomNutriment" [name]="'nutriment' + $index" [options]="nutriments" />
      <p-inputnumber placeholder="Min" [(ngModel)]="besoin.valeurMin" [name]="'min' + $index" />
      <p-inputnumber placeholder="Max" [(ngModel)]="besoin.valeurMax" [name]="'max' + $index" />
      <p-button icon="pi pi-trash" severity="danger" text pTooltip="Supprimer ce besoin" aria-label="Supprimer ce besoin" (onClick)="supprimerLigne($index)" />
    </div>
  }
  <p-button label="Ajouter un nutriment" icon="pi pi-plus" severity="secondary" type="button" (onClick)="ajouterLigne()" />

  <div class="submit-row"><p-button label="Enregistrer le profil" icon="pi pi-check" type="submit" /></div>
  </form>
</p-card>
